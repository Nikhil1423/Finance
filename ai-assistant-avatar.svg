<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1a2340"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a67"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dd0e1"/>
      <stop offset="0.5" stop-color="#7c4dff"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0f7fa"/>
      <stop offset="1" stop-color="#4dd0e1"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="200" fill="#4dd0e1" opacity="0.08" filter="url(#soft)"/>
  <circle cx="256" cy="256" r="150" fill="#7c4dff" opacity="0.10" filter="url(#soft)"/>

  <!-- Head -->
  <rect x="110" y="120" width="292" height="272" rx="64" fill="url(#face)" stroke="#3a4a78" stroke-width="3"/>

  <!-- Neck base -->
  <rect x="196" y="370" width="120" height="40" rx="12" fill="#16203a" stroke="#3a4a78" stroke-width="2"/>

  <!-- Body -->
  <path d="M150 410 Q256 470 362 410 L340 500 Q256 512 172 500 Z" fill="#16203a" stroke="#3a4a78" stroke-width="2"/>

  <!-- Eyes -->
  <ellipse cx="196" cy="230" rx="34" ry="40" fill="#0b1020"/>
  <ellipse cx="316" cy="230" rx="34" ry="40" fill="#0b1020"/>
  <circle cx="196" cy="230" r="16" fill="url(#eye)"/>
  <circle cx="316" cy="230" r="16" fill="url(#eye)"/>
  <circle cx="202" cy="224" r="5" fill="#e0f7fa"/>
  <circle cx="322" cy="224" r="5" fill="#e0f7fa"/>

  <!-- Mouth -->
  <path d="M226 300 Q256 320 286 300" stroke="#4dd0e1" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Interface accents -->
  <rect x="150" y="150" width="212" height="14" rx="4" fill="#0b1020" stroke="#3a4a78" stroke-width="1"/>
  <rect x="170" y="152" width="40" height="10" rx="2" fill="#4dd0e1" opacity="0.8"/>
  <rect x="220" y="152" width="30" height="10" rx="2" fill="#7c4dff" opacity="0.6"/>
  <rect x="260" y="152" width="24" height="10" rx="2" fill="#4dd0e1" opacity="0.4"/>

  <rect x="150" y="430" width="212" height="14" rx="4" fill="#0b1020" stroke="#3a4a78" stroke-width="1"/>
  <rect x="170" y="432" width="60" height="10" rx="2" fill="#7c4dff" opacity="0.7"/>
  <rect x="240" y="432" width="36" height="10" rx="2" fill="#4dd0e1" opacity="0.5"/>

  <!-- Ear "antennae" -->
  <path d="M150 140 L130 70 L170 110" stroke="#4dd0e1" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M362 140 L382 70 L342 110" stroke="#7c4dff" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="130" cy="70" r="6" fill="#4dd0e1" filter="url(#soft)"/>
  <circle cx="382" cy="70" r="6" fill="#7c4dff" filter="url(#soft)"/>

  <!-- Glow ring -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.4"/>
</svg>